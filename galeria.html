<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nuestra historia en imágenes</title>

<style>

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  padding: 50px 20px;
  background: #f7f4ef;
  color: #3f3a36;
  font-family: Georgia, "Times New Roman", serif;
}

/* CABECERA */

.cabecera {
  text-align: center;
  margin-bottom: 45px;
}

.cabecera h1 {
  margin: 0 0 12px;
  font-size: clamp(32px, 5vw, 55px);
  font-weight: 400;
  letter-spacing: 1px;
}

.cabecera p {
  margin: 0;
  font-family: Arial, sans-serif;
  font-size: 15px;
  color: #77716c;
  letter-spacing: 1px;
}


/* GALERÍA TIPO MOSAICO */

.galeria {
  max-width: 1250px;
  margin: auto;
  columns: 3;
  column-gap: 16px;
}

.foto {
  position: relative;
  overflow: hidden;
  margin-bottom: 16px;
  border-radius: 12px;
  cursor: pointer;
  break-inside: avoid;

  box-shadow: 0 4px 14px rgba(0,0,0,0.08);

  opacity: 0;
  transform: translateY(20px);

  animation: aparecer 0.7s ease forwards;
}

@keyframes aparecer {

  to {
    opacity: 1;
    transform: translateY(0);
  }

}

.foto img {
  width: 100%;
  display: block;

  transition:
    transform 0.6s ease,
    filter 0.6s ease;
}

.foto:hover img {
  transform: scale(1.045);
  filter: brightness(0.88);
}


/* TEXTO AL PASAR EL RATÓN */

.foto::after {
  content: "Ver foto";

  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(0,0,0,0.20);

  color: white;

  font-family: Arial, sans-serif;
  font-size: 13px;
  letter-spacing: 2px;

  opacity: 0;

  transition: opacity 0.4s ease;

  pointer-events: none;
}

.foto:hover::after {
  opacity: 1;
}


/* LIGHTBOX */

.lightbox {
  position: fixed;
  inset: 0;

  display: none;
  align-items: center;
  justify-content: center;

  background: rgba(18,17,16,0.96);

  z-index: 9999;

  padding: 30px;
}

.lightbox.activo {
  display: flex;
}

.lightbox img {
  max-width: 90vw;
  max-height: 88vh;

  object-fit: contain;

  border-radius: 6px;

  box-shadow: 0 20px 60px rgba(0,0,0,0.5);

  animation: zoom 0.3s ease;
}

@keyframes zoom {

  from {
    opacity: 0;
    transform: scale(0.94);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }

}


/* BOTÓN CERRAR */

.cerrar {
  position: absolute;

  top: 18px;
  right: 28px;

  color: white;

  font-family: Arial, sans-serif;
  font-size: 40px;

  cursor: pointer;

  opacity: 0.8;

  z-index: 10;

  user-select: none;
}

.cerrar:hover {
  opacity: 1;
}


/* FLECHAS */

.flecha {
  position: absolute;

  top: 50%;

  transform: translateY(-50%);

  color: white;

  font-family: Arial, sans-serif;
  font-size: 55px;

  cursor: pointer;

  opacity: 0.7;

  padding: 20px;

  user-select: none;

  z-index: 10;
}

.flecha:hover {
  opacity: 1;
}

.anterior {
  left: 15px;
}

.siguiente {
  right: 15px;
}


/* CONTADOR DE FOTOS */

.contador {
  position: absolute;

  bottom: 18px;
  left: 50%;

  transform: translateX(-50%);

  color: white;

  font-family: Arial, sans-serif;
  font-size: 13px;

  letter-spacing: 2px;

  opacity: 0.75;
}


/* TABLET */

@media (max-width: 900px) {

  .galeria {
    columns: 2;
  }

}


/* MÓVIL */

@media (max-width: 600px) {

  body {
    padding: 35px 10px;
  }

  .cabecera {
    margin-bottom: 30px;
  }

  .cabecera h1 {
    font-size: 34px;
  }

  .cabecera p {
    font-size: 13px;
  }

  .galeria {
    columns: 2;
    column-gap: 8px;
  }

  .foto {
    margin-bottom: 8px;
    border-radius: 7px;
  }

  .lightbox {
    padding: 10px;
  }

  .lightbox img {
    max-width: 95vw;
    max-height: 82vh;
  }

  .flecha {
    font-size: 38px;
    padding: 8px;
  }

  .anterior {
    left: 2px;
  }

  .siguiente {
    right: 2px;
  }

  .cerrar {
    top: 10px;
    right: 17px;
  }

}

</style>
</head>


<body>


<!-- CABECERA -->

<div class="cabecera">

  <h1>Nuestra historia en imágenes</h1>

  <p>Algunos momentos antes del gran día</p>

</div>


<!-- AQUÍ SE GENERAN AUTOMÁTICAMENTE LAS 26 FOTOS -->

<div class="galeria" id="galeria"></div>


<!-- VISOR DE FOTOS -->

<div class="lightbox" id="lightbox">

  <div class="cerrar" id="cerrar">
    ×
  </div>

  <div class="flecha anterior" id="anterior">
    ‹
  </div>

  <img
    id="imagenGrande"
    src=""
    alt="Nuestra historia"
  >

  <div class="flecha siguiente" id="siguiente">
    ›
  </div>

  <div
    class="contador"
    id="contador">
  </div>

</div>


<script>

/* =========================================
   GENERAR AUTOMÁTICAMENTE LAS 26 FOTOS
   foto (1).jpg → foto (26).jpg
========================================= */

const galeria =
  document.getElementById("galeria");


for (let i = 1; i <= 26; i++) {

  const contenedor =
    document.createElement("div");

  contenedor.className = "foto";


  /* Animación escalonada */

  contenedor.style.animationDelay =
    Math.min((i - 1) * 0.05, 0.7) + "s";


  const imagen =
    document.createElement("img");


  imagen.src =
    `foto (${i}).jpg`;


  imagen.alt =
    `Nuestra historia - Foto ${i}`;


  /* Las primeras fotos cargan inmediatamente.
     El resto carga cuando sea necesario. */

  if (i > 6) {

    imagen.loading = "lazy";

  }


  contenedor.appendChild(imagen);

  galeria.appendChild(contenedor);

}


/* =========================================
   VISOR / LIGHTBOX
========================================= */

const fotos =
  document.querySelectorAll(".foto img");


const lightbox =
  document.getElementById("lightbox");


const imagenGrande =
  document.getElementById("imagenGrande");


const cerrar =
  document.getElementById("cerrar");


const anterior =
  document.getElementById("anterior");


const siguiente =
  document.getElementById("siguiente");


const contador =
  document.getElementById("contador");


let indiceActual = 0;


/* ACTUALIZAR FOTO GRANDE */

function actualizarFoto() {

  imagenGrande.src =
    fotos[indiceActual].src;


  contador.textContent =
    `${indiceActual + 1} / ${fotos.length}`;

}


/* ABRIR FOTO */

function mostrarFoto(indice) {

  indiceActual = indice;

  actualizarFoto();

  lightbox.classList.add("activo");

  document.body.style.overflow = "hidden";

}


/* CLICK SOBRE LAS FOTOS */

fotos.forEach(
  (foto, indice) => {

    foto.addEventListener(
      "click",
      () => {

        mostrarFoto(indice);

      }
    );

  }
);


/* FOTO ANTERIOR */

function fotoAnterior() {

  indiceActual--;

  if (indiceActual < 0) {

    indiceActual =
      fotos.length - 1;

  }

  actualizarFoto();

}


/* FOTO SIGUIENTE */

function fotoSiguiente() {

  indiceActual++;

  if (indiceActual >= fotos.length) {

    indiceActual = 0;

  }

  actualizarFoto();

}


/* FLECHAS */

anterior.addEventListener(
  "click",
  fotoAnterior
);


siguiente.addEventListener(
  "click",
  fotoSiguiente
);


/* CERRAR GALERÍA */

function cerrarGaleria() {

  lightbox.classList.remove("activo");

  document.body.style.overflow = "auto";

}


cerrar.addEventListener(
  "click",
  cerrarGaleria
);


/* CERRAR PULSANDO FUERA DE LA FOTO */

lightbox.addEventListener(
  "click",
  (e) => {

    if (e.target === lightbox) {

      cerrarGaleria();

    }

  }
);


/* =========================================
   CONTROL CON TECLADO
========================================= */

document.addEventListener(
  "keydown",
  (e) => {

    if (
      !lightbox.classList.contains("activo")
    ) {

      return;

    }


    if (e.key === "ArrowRight") {

      fotoSiguiente();

    }


    if (e.key === "ArrowLeft") {

      fotoAnterior();

    }


    if (e.key === "Escape") {

      cerrarGaleria();

    }

  }
);


/* =========================================
   DESLIZAR CON EL DEDO EN MÓVIL
========================================= */

let inicioTouch = 0;


imagenGrande.addEventListener(
  "touchstart",
  (e) => {

    inicioTouch =
      e.changedTouches[0].screenX;

  },
  { passive: true }
);


imagenGrande.addEventListener(
  "touchend",
  (e) => {

    const finalTouch =
      e.changedTouches[0].screenX;


    const diferencia =
      inicioTouch - finalTouch;


    /* Ignorar movimientos pequeños */

    if (Math.abs(diferencia) < 50) {

      return;

    }


    /* Deslizar hacia izquierda */

    if (diferencia > 0) {

      fotoSiguiente();

    }


    /* Deslizar hacia derecha */

    else {

      fotoAnterior();

    }

  },
  { passive: true }
);

</script>


</body>
</html>
