<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nuestra historia</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: #f7f4ef;
      color: #3f3a36;
      font-family: Georgia, "Times New Roman", serif;
      padding: 50px 20px 80px;
    }

    .cabecera {
      text-align: center;
      margin-bottom: 65px;
    }

    .cabecera h1 {
      margin: 0 0 12px;
      font-size: 55px;
      font-weight: 400;
    }

    .cabecera p {
      margin: 0;
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      color: #77716c;
    }

    .seccion {
      max-width: 1200px;
      margin: 0 auto 80px;
    }

    .titulo {
      text-align: center;
      margin-bottom: 30px;
    }

    .titulo h2 {
      margin: 0;
      font-size: 38px;
      font-style: italic;
      font-weight: 400;
    }

    .linea {
      width: 50px;
      height: 1px;
      background: #9d9287;
      margin: 14px auto 0;
    }

    .galeria {
      columns: 3;
      column-gap: 15px;
    }

    .foto {
      width: 100%;
      display: inline-block;
      margin: 0 0 15px;
      break-inside: avoid;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 3px 14px rgba(0,0,0,0.10);
      cursor: pointer;
    }

    .foto img {
      width: 100%;
      height: auto;
      display: block;
      opacity: 1;
    }

    .foto img:hover {
      transform: scale(1.02);
      transition: transform 0.3s ease;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      display: none;
      background: rgba(0,0,0,0.93);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }

    .lightbox.activo {
      display: flex;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 85%;
      object-fit: contain;
    }

    .cerrar {
      position: absolute;
      top: 15px;
      right: 25px;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 42px;
      cursor: pointer;
    }

    @media (max-width: 850px) {

      .galeria {
        columns: 2;
      }

    }

    @media (max-width: 500px) {

      body {
        padding: 30px 8px 60px;
      }

      .cabecera h1 {
        font-size: 38px;
      }

      .titulo h2 {
        font-size: 29px;
      }

      .galeria {
        columns: 2;
        column-gap: 8px;
      }

      .foto {
        margin-bottom: 8px;
        border-radius: 6px;
      }

    }

  </style>

</head>


<body>


  <div class="cabecera">

    <h1>Nuestra historia</h1>

    <p>UN CAMINO QUE NOS HA TRAÍDO HASTA AQUÍ</p>

  </div>



  <!-- LA CASUALIDAD -->

  <section class="seccion">

    <div class="titulo">
      <h2>La casualidad</h2>
      <div class="linea"></div>
    </div>

    <div class="galeria">

      <div class="foto">
        <img src="./galeria/foto%20(13).JPG" alt="La casualidad">
      </div>

      <div class="foto">
        <img src="./galeria/foto%20(20).JPG" alt="La casualidad">
      </div>

    </div>

  </section>



  <!-- EL SECRETO -->

  <section class="seccion">

    <div class="titulo">
      <h2>El Secreto</h2>
      <div class="linea"></div>
    </div>

    <div class="galeria">

      <div class="foto">
        <img src="./galeria/foto%20(24).JPG">
      </div>

      <div class="foto">
        <img src="./galeria/foto%20(23).JPG">
      </div>

      <div class="foto">
        <img src="./galeria/foto%20(22).JPG">
      </div>

      <div class="foto">
        <img src="./galeria/foto%20(8).JPG">
      </div>

      <div class="foto">
        <img src="./galeria/foto%20(7).JPG">
      </div>

    </div>

  </section>



  <!-- LA PAREJA -->

  <section class="seccion">

    <div class="titulo">
      <h2>La pareja</h2>
      <div class="linea"></div>
    </div>

    <div class="galeria">

      <div class="foto"><img src="./galeria/foto%20(10).JPG"></div>
      <div class="foto"><img src="./galeria/foto%20(15).JPG"></div>
      <div class="foto"><img src="./galeria/foto%20(17).JPG"></div>
      <div class="foto"><img src="./galeria/foto%20(5).JPG"></div>
      <div class="foto"><img src="./galeria/foto%20(6).JPG"></div>
      <div class="foto"><img src="./galeria/foto%20(11).JPG"></div>
      <div class="foto"><img src="./galeria/foto%20(12).JPG"></div>
      <div class="foto"><img src="./galeria/foto%20(2).JPG"></div>
      <div class="foto"><img src="./galeria/foto%20(16).JPG"></div>

    </div>

  </section>



  <!-- LA PROMESA -->

  <section class="seccion">

    <div class="titulo">
      <h2>La promesa</h2>
      <div class="linea"></div>
    </div>

    <div class="galeria">

      <div class="foto"><img src="./galeria/foto%20(1).JPG"></div>
      <div class="foto"><img src="./galeria/foto%20(3).JPG"></div>
      <div class="foto"><img src="./galeria/foto%20(4).JPG"></div>
      <div class="foto"><img src="./galeria/foto%20(9).JPG"></div>
      <div class="foto"><img src="./galeria/foto%20(14).JPG"></div>
      <div class="foto"><img src="./galeria/foto%20(18).JPG"></div>
      <div class="foto"><img src="./galeria/foto%20(19).JPG"></div>
      <div class="foto"><img src="./galeria/foto%20(25).JPG"></div>
      <div class="foto"><img src="./galeria/foto%20(26).JPG"></div>

    </div>

  </section>



  <!-- HOY EN DÍA -->

  <section class="seccion">

    <div class="titulo">
      <h2>Hoy en día</h2>
      <div class="linea"></div>
    </div>

    <div class="galeria">

      <div class="foto"><img src="./galeria/foto%20(21).JPG"></div>
      <div class="foto"><img src="./galeria/foto%20(27).JPG"></div>
      <div class="foto"><img src="./galeria/foto%20(28).JPG"></div>
      <div class="foto"><img src="./galeria/foto%20(29).JPG"></div>
      <div class="foto"><img src="./galeria/foto%20(30).JPG"></div>

    </div>

  </section>



  <!-- VISOR -->

  <div class="lightbox" id="lightbox">

    <div class="cerrar" id="cerrar">×</div>

    <img id="imagenGrande">

  </div>



  <script>

    const imagenes =
      document.querySelectorAll(".foto img");

    const lightbox =
      document.getElementById("lightbox");

    const imagenGrande =
      document.getElementById("imagenGrande");

    const cerrar =
      document.getElementById("cerrar");


    imagenes.forEach(function(imagen) {

      imagen.addEventListener("click", function() {

        imagenGrande.src = imagen.src;

        lightbox.classList.add("activo");

      });

    });


    cerrar.addEventListener("click", function() {

      lightbox.classList.remove("activo");

    });


    lightbox.addEventListener("click", function(evento) {

      if (evento.target === lightbox) {

        lightbox.classList.remove("activo");

      }

    });


    document.addEventListener("keydown", function(evento) {

      if (evento.key === "Escape") {

        lightbox.classList.remove("activo");

      }

    });

  </script>


</body>

</html>
