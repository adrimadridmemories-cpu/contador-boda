<style>

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  background: #f7f4ef;
  color: #3f3a36;
  font-family: Georgia, "Times New Roman", serif;
  padding: 50px 20px 80px;
}


/* CABECERA */

.cabecera {
  text-align: center;
  margin-bottom: 70px;
}

.cabecera h1 {
  margin: 0 0 14px;
  font-size: clamp(40px, 6vw, 58px);
  font-weight: 400;
}

.cabecera p {
  margin: 0;
  font-family: Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 2px;
  color: #77716c;
}


/* SECCIONES */

.seccion {
  max-width: 1200px;
  margin: 0 auto 85px;
}

.titulo {
  text-align: center;
  margin-bottom: 32px;
}

.titulo h2 {
  margin: 0;
  font-size: clamp(30px, 4vw, 40px);
  font-weight: 400;
  font-style: italic;
}

.linea {
  width: 52px;
  height: 1px;
  background: #9d9287;
  margin: 14px auto 0;
}


/* GALERÍA */

.galeria {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.foto {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 3;
  overflow: hidden;
  border-radius: 11px;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(0,0,0,0.10);
}

.foto img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  object-position: center;
  transition: transform 0.35s ease, filter 0.35s ease;
}

.foto:hover img {
  transform: scale(1.03);
  filter: brightness(0.92);
}

.foto::after {
  content: "Ver foto";
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  color: white;
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 2px;

  background: rgba(20,18,16,0.12);

  opacity: 0;

  transition: opacity 0.3s ease;

  pointer-events: none;
}

.foto:hover::after {
  opacity: 1;
}


/* VISOR */

.lightbox {
  display: none;
  position: fixed;
  inset: 0;

  background: rgba(15,14,13,0.96);

  z-index: 99999;

  align-items: center;
  justify-content: center;

  padding: 30px;
}

.lightbox.activo {
  display: flex;
}

.lightbox img {
  max-width: 90vw;
  max-height: 84vh;
  object-fit: contain;

  border-radius: 5px;

  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

.cerrar {
  position: absolute;
  top: 15px;
  right: 25px;

  color: white;

  font-family: Arial, sans-serif;
  font-size: 42px;

  cursor: pointer;
  user-select: none;

  z-index: 10;
}

.flecha {
  position: absolute;
  top: 50%;

  transform: translateY(-50%);

  color: white;

  font-family: Arial, sans-serif;
  font-size: 55px;

  padding: 20px;

  cursor: pointer;
  user-select: none;

  z-index: 10;
}

.anterior {
  left: 5px;
}

.siguiente {
  right: 5px;
}

.info {
  position: absolute;
  bottom: 14px;
  left: 50%;

  transform: translateX(-50%);

  text-align: center;
  color: white;
}

.info-seccion {
  font-size: 17px;
  font-style: italic;
  margin-bottom: 5px;
}

.contador {
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
  opacity: 0.8;
}


/* TABLET */

@media (max-width: 900px) {

  .galeria {
    columns: 2;
  }

}


/* MÓVIL */

@media (max-width: 900px) {

  .galeria {
    grid-template-columns: repeat(2, 1fr);
  }

}

@media (max-width: 600px) {

  .galeria {
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .foto {
    border-radius: 7px;
  }

}

  .lightbox {
    padding: 8px;
  }

  .lightbox img {
    max-width: 96vw;
    max-height: 78vh;
  }

  .flecha {
    font-size: 40px;
    padding: 8px;
  }

  .anterior {
    left: 0;
  }

  .siguiente {
    right: 0;
  }

}

</style>

</head>

<!-- VISOR -->

<div class="lightbox" id="lightbox">

  <div class="cerrar" id="cerrar">×</div>

  <div class="flecha anterior" id="anterior">‹</div>

  <img id="imagenGrande" src="">

  <div class="flecha siguiente" id="siguiente">›</div>

  <div class="info">

    <div class="info-seccion" id="infoSeccion"></div>

    <div class="contador" id="contador"></div>

  </div>

</div>



<script>

const fotos =
  Array.from(document.querySelectorAll(".foto img"));

const lightbox =
  document.getElementById("lightbox");

const imagenGrande =
  document.getElementById("imagenGrande");

const infoSeccion =
  document.getElementById("infoSeccion");

const contador =
  document.getElementById("contador");

let indice = 0;


function actualizarFoto() {

  imagenGrande.src = fotos[indice].src;

  infoSeccion.textContent =
    fotos[indice].dataset.seccion;

  contador.textContent =
    (indice + 1) + " / " + fotos.length;

}


function abrirFoto(posicion) {

  indice = posicion;

  actualizarFoto();

  lightbox.classList.add("activo");

  document.body.style.overflow = "hidden";

}


function cerrarFoto() {

  lightbox.classList.remove("activo");

  document.body.style.overflow = "";

}


function siguienteFoto() {

  indice++;

  if (indice >= fotos.length) {
    indice = 0;
  }

  actualizarFoto();

}


function anteriorFoto() {

  indice--;

  if (indice < 0) {
    indice = fotos.length - 1;
  }

  actualizarFoto();

}


fotos.forEach(function(foto, posicion) {

  foto.addEventListener("click", function() {

    abrirFoto(posicion);

  });

});


document
.getElementById("cerrar")
.addEventListener("click", cerrarFoto);


document
.getElementById("siguiente")
.addEventListener("click", siguienteFoto);


document
.getElementById("anterior")
.addEventListener("click", anteriorFoto);


lightbox.addEventListener("click", function(evento) {

  if (evento.target === lightbox) {

    cerrarFoto();

  }

});


document.addEventListener("keydown", function(evento) {

  if (!lightbox.classList.contains("activo")) {
    return;
  }

  if (evento.key === "Escape") {
    cerrarFoto();
  }

  if (evento.key === "ArrowRight") {
    siguienteFoto();
  }

  if (evento.key === "ArrowLeft") {
    anteriorFoto();
  }

});

</script>
