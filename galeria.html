<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nuestra historia</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {
  background: #f7f4ef;
  color: #3f3a36;
  font-family: Georgia, "Times New Roman", serif;
  padding: 55px 20px 80px;
}


/* CABECERA */

.cabecera {
  text-align: center;
  max-width: 900px;
  margin: 0 auto 70px;
}

.cabecera h1 {
  margin: 0 0 14px;
  font-size: clamp(38px, 6vw, 64px);
  font-weight: 400;
  letter-spacing: 1px;
}

.cabecera p {
  margin: 0;
  font-family: Arial, sans-serif;
  font-size: 13px;
  color: #77716c;
  letter-spacing: 2px;
}


/* SECCIONES */

.seccion {
  max-width: 1250px;
  margin: 0 auto 90px;
}

.titulo-seccion {
  text-align: center;
  margin-bottom: 35px;
}

.titulo-seccion h2 {
  margin: 0;
  font-size: clamp(29px, 4vw, 43px);
  font-weight: 400;
  font-style: italic;
}

.linea {
  width: 55px;
  height: 1px;
  margin: 16px auto 0;
  background: #9d9287;
}


/* GALERÍA */

.galeria {
  columns: 3;
  column-gap: 16px;
}

.foto {
  position: relative;

  display: inline-block;

  width: 100%;

  margin: 0 0 16px;

  break-inside: avoid;

  overflow: hidden;

  border-radius: 12px;

  cursor: pointer;

  box-shadow: 0 4px 16px rgba(0,0,0,0.09);
}

.foto img {
  display: block;

  width: 100%;
  height: auto;

  opacity: 1;

  transition:
    transform 0.5s ease,
    filter 0.5s ease;
}

.foto:hover img {
  transform: scale(1.035);
  filter: brightness(0.9);
}

.foto::after {
  content: "Ver foto";

  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(20,18,16,0.18);

  color: white;

  font-family: Arial, sans-serif;
  font-size: 12px;

  letter-spacing: 2px;

  opacity: 0;

  transition: opacity 0.3s ease;

  pointer-events: none;
}

.foto:hover::after {
  opacity: 1;
}


/* LIGHTBOX */

.lightbox {
  position: fixed;

  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  background: rgba(18,17,16,0.96);

  z-index: 99999;

  padding: 30px;
}

.lightbox.activo {
  display: flex;
}

.lightbox img {
  max-width: 90vw;
  max-height: 84vh;

  object-fit: contain;

  border-radius: 6px;

  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}


/* CERRAR */

.cerrar {
  position: absolute;

  top: 18px;
  right: 28px;

  color: white;

  font-family: Arial, sans-serif;
  font-size: 40px;

  cursor: pointer;

  z-index: 5;

  user-select: none;
}


/* FLECHAS */

.flecha {
  position: absolute;

  top: 50%;

  transform: translateY(-50%);

  color: white;

  font-family: Arial, sans-serif;

  font-size: 55px;

  cursor: pointer;

  padding: 20px;

  user-select: none;

  z-index: 5;
}

.anterior {
  left: 10px;
}

.siguiente {
  right: 10px;
}


/* INFORMACIÓN FOTO */

.info-foto {
  position: absolute;

  bottom: 15px;
  left: 50%;

  transform: translateX(-50%);

  text-align: center;

  color: white;

  white-space: nowrap;
}

.nombre-seccion {
  font-style: italic;

  font-size: 17px;

  margin-bottom: 5px;
}

.contador {
  font-family: Arial, sans-serif;

  font-size: 11px;

  letter-spacing: 2px;

  opacity: 0.75;
}


/* TABLET */

@media (max-width: 900px) {

  .galeria {
    columns: 2;
  }

}


/* MÓVIL */

@media (max-width: 600px) {

  body {
    padding: 35px 9px 60px;
  }

  .cabecera {
    margin-bottom: 50px;
  }

  .cabecera h1 {
    font-size: 39px;
  }

  .cabecera p {
    font-size: 10px;
    letter-spacing: 1.5px;
  }

  .seccion {
    margin-bottom: 60px;
  }

  .titulo-seccion {
    margin-bottom: 25px;
  }

  .titulo-seccion h2 {
    font-size: 30px;
  }

  .galeria {
    columns: 2;
    column-gap: 8px;
  }

  .foto {
    margin-bottom: 8px;
    border-radius: 7px;
  }

  .lightbox {
    padding: 8px;
  }

  .lightbox img {
    max-width: 96vw;
    max-height: 78vh;
  }

  .flecha {
    font-size: 40px;
    padding: 8px;
  }

  .anterior {
    left: 0;
  }

  .siguiente {
    right: 0;
  }

  .cerrar {
    top: 8px;
    right: 15px;
  }

}

</style>

</head>


<body>


<div class="cabecera">

  <h1>Nuestra historia</h1>

  <p>UN CAMINO QUE NOS HA TRAÍDO HASTA AQUÍ</p>

</div>


<div id="contenido"></div>


<!-- VISOR -->

<div class="lightbox" id="lightbox">

  <div class="cerrar" id="cerrar">
    ×
  </div>

  <div class="flecha anterior" id="anterior">
    ‹
  </div>

  <img
    id="imagenGrande"
    src=""
    alt="Nuestra historia"
  >

  <div class="flecha siguiente" id="siguiente">
    ›
  </div>

  <div class="info-foto">

    <div
      class="nombre-seccion"
      id="nombreSeccion">
    </div>

    <div
      class="contador"
      id="contador">
    </div>

  </div>

</div>


<script>

/* ========================================
   ORGANIZACIÓN DE LAS FOTOS
======================================== */

const secciones = [

  {
    titulo: "La casualidad",

    fotos: [
      "foto (13).JPG",
      "foto (20).JPG"
    ]
  },


  {
    titulo: "El Secreto",

    fotos: [
      "foto (24).JPG",
      "foto (23).JPG",
      "foto (22).JPG",
      "foto (8).JPG",
      "foto (7).JPG"
    ]
  },


  {
    titulo: "La pareja",

    fotos: [
      "foto (10).JPG",
      "foto (15).JPG",
      "foto (17).JPG",
      "foto (5).JPG",
      "foto (6).JPG",
      "foto (11).JPG",
      "foto (12).JPG",
      "foto (2).JPG",
      "foto (16).JPG"
    ]
  },


  {
    titulo: "La promesa",

    fotos: [
      "foto (1).JPG",
      "foto (3).JPG",
      "foto (4).JPG",
      "foto (9).JPG",
      "foto (14).JPG",
      "foto (18).JPG",
      "foto (19).JPG",
      "foto (25).JPG",
      "foto (26).JPG"
    ]
  },


  {
    titulo: "Hoy en día",

    fotos: [
      "foto (21).JPG",

      "foto (27).JPEG",
      "foto (27).JPG",

      "foto (28).JPEG",
      "foto (28).JPG",

      "foto (29).JPEG",

      "foto (30).JPEG"
    ]
  }

];


/* ========================================
   CREAR GALERÍA
======================================== */

const contenido =
  document.getElementById("contenido");


const todasLasFotos = [];


secciones.forEach((seccion) => {

  const bloque =
    document.createElement("section");

  bloque.className =
    "seccion";


  const encabezado =
    document.createElement("div");

  encabezado.className =
    "titulo-seccion";


  const h2 =
    document.createElement("h2");

  h2.textContent =
    seccion.titulo;


  const linea =
    document.createElement("div");

  linea.className =
    "linea";


  encabezado.appendChild(h2);

  encabezado.appendChild(linea);


  const galeria =
    document.createElement("div");

  galeria.className =
    "galeria";


  seccion.fotos.forEach((archivo) => {

    const contenedorFoto =
      document.createElement("div");

    contenedorFoto.className =
      "foto";


    const imagen =
      document.createElement("img");


    /*
      IMPORTANTE:
      las fotos están en /galeria/
      encodeURIComponent evita problemas
      con espacios y paréntesis.
    */

    imagen.src =
      "./galeria/" +
      encodeURIComponent(archivo);


    imagen.alt =
      seccion.titulo;


    imagen.dataset.seccion =
      seccion.titulo;


    imagen.dataset.archivo =
      archivo;


    contenedorFoto.appendChild(imagen);

    galeria.appendChild(contenedorFoto);


    todasLasFotos.push(imagen);

  });


  bloque.appendChild(encabezado);

  bloque.appendChild(galeria);


  contenido.appendChild(bloque);

});


/* ========================================
   LIGHTBOX
======================================== */

const lightbox =
  document.getElementById("lightbox");


const imagenGrande =
  document.getElementById("imagenGrande");


const cerrar =
  document.getElementById("cerrar");


const anterior =
  document.getElementById("anterior");


const siguiente =
  document.getElementById("siguiente");


const contador =
  document.getElementById("contador");


const nombreSeccion =
  document.getElementById("nombreSeccion");


let indiceActual = 0;


/* ACTUALIZAR VISOR */

function actualizarFoto() {

  const foto =
    todasLasFotos[indiceActual];


  imagenGrande.src =
    foto.src;


  nombreSeccion.textContent =
    foto.dataset.seccion;


  contador.textContent =
    `${indiceActual + 1} / ${todasLasFotos.length}`;

}


/* ABRIR */

function abrirFoto(indice) {

  indiceActual =
    indice;


  actualizarFoto();


  lightbox.classList.add(
    "activo"
  );


  document.body.style.overflow =
    "hidden";

}


/* CLICK EN CADA FOTO */

todasLasFotos.forEach(
  (foto, indice) => {

    foto.addEventListener(
      "click",
      function() {

        abrirFoto(indice);

      }
    );

  }
);


/* SIGUIENTE */

function fotoSiguiente() {

  indiceActual++;

  if (
    indiceActual >=
    todasLasFotos.length
  ) {

    indiceActual = 0;

  }


  actualizarFoto();

}


/* ANTERIOR */

function fotoAnterior() {

  indiceActual--;

  if (indiceActual < 0) {

    indiceActual =
      todasLasFotos.length - 1;

  }


  actualizarFoto();

}


/* CERRAR */

function cerrarLightbox() {

  lightbox.classList.remove(
    "activo"
  );


  document.body.style.overflow =
    "";

}


/* BOTONES */

siguiente.addEventListener(
  "click",
  fotoSiguiente
);


anterior.addEventListener(
  "click",
  fotoAnterior
);


cerrar.addEventListener(
  "click",
  cerrarLightbox
);


/* CLICK EN EL FONDO */

lightbox.addEventListener(
  "click",
  function(evento) {

    if (
      evento.target === lightbox
    ) {

      cerrarLightbox();

    }

  }
);


/* TECLADO */

document.addEventListener(
  "keydown",
  function(evento) {

    if (
      !lightbox.classList.contains(
        "activo"
      )
    ) {

      return;

    }


    if (
      evento.key ===
      "ArrowRight"
    ) {

      fotoSiguiente();

    }


    if (
      evento.key ===
      "ArrowLeft"
    ) {

      fotoAnterior();

    }


    if (
      evento.key ===
      "Escape"
    ) {

      cerrarLightbox();

    }

  }
);


/* ========================================
   DESLIZAR EN MÓVIL
======================================== */

let inicioTouch = 0;


imagenGrande.addEventListener(
  "touchstart",
  function(evento) {

    inicioTouch =
      evento.changedTouches[0].screenX;

  },
  {
    passive: true
  }
);


imagenGrande.addEventListener(
  "touchend",
  function(evento) {

    const finalTouch =
      evento.changedTouches[0].screenX;


    const diferencia =
      inicioTouch -
      finalTouch;


    if (
      Math.abs(diferencia) < 50
    ) {

      return;

    }


    if (
      diferencia > 0
    ) {

      fotoSiguiente();

    }

    else {

      fotoAnterior();

    }

  },
  {
    passive: true
  }
);

</script>

</body>

</html>
