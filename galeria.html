<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nuestra historia</title>

<style>

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  padding: 55px 20px 80px;
  background: #f7f4ef;
  color: #3f3a36;
  font-family: Georgia, "Times New Roman", serif;
}


/* =========================
   CABECERA
========================= */

.cabecera {
  text-align: center;
  max-width: 800px;
  margin: 0 auto 75px;
}

.cabecera h1 {
  margin: 0 0 15px;
  font-size: clamp(38px, 6vw, 64px);
  font-weight: 400;
  letter-spacing: 1px;
}

.cabecera p {
  margin: 0;
  font-family: Arial, sans-serif;
  font-size: 14px;
  color: #77716c;
  letter-spacing: 2px;
}


/* =========================
   SECCIONES
========================= */

.seccion {
  max-width: 1250px;
  margin: 0 auto 90px;
}

.titulo-seccion {
  text-align: center;
  margin-bottom: 35px;
}

.titulo-seccion h2 {
  margin: 0;
  font-size: clamp(29px, 4vw, 43px);
  font-weight: 400;
  font-style: italic;
  letter-spacing: 0.5px;
}

.linea {
  width: 55px;
  height: 1px;
  background: #9d9287;
  margin: 17px auto 0;
}


/* =========================
   MOSAICO
========================= */

.galeria {
  columns: 3;
  column-gap: 16px;
}

.foto {
  position: relative;
  overflow: hidden;
  margin-bottom: 16px;
  border-radius: 12px;
  cursor: pointer;
  break-inside: avoid;

  box-shadow: 0 4px 16px rgba(0,0,0,0.09);

  opacity: 0;
  transform: translateY(20px);

  animation: aparecer 0.7s ease forwards;
}

@keyframes aparecer {

  to {
    opacity: 1;
    transform: translateY(0);
  }

}

.foto img {
  width: 100%;
  display: block;

  transition:
    transform 0.65s ease,
    filter 0.65s ease;
}

.foto:hover img {
  transform: scale(1.045);
  filter: brightness(0.87);
}

.foto::after {
  content: "Ver foto";

  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(25,20,17,0.20);

  color: white;

  font-family: Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 2px;

  opacity: 0;

  transition: opacity 0.4s ease;

  pointer-events: none;
}

.foto:hover::after {
  opacity: 1;
}


/* =========================
   LIGHTBOX
========================= */

.lightbox {
  position: fixed;
  inset: 0;

  display: none;
  align-items: center;
  justify-content: center;

  background: rgba(18,17,16,0.96);

  z-index: 9999;

  padding: 30px;
}

.lightbox.activo {
  display: flex;
}

.lightbox img {
  max-width: 90vw;
  max-height: 86vh;

  object-fit: contain;

  border-radius: 6px;

  box-shadow: 0 20px 60px rgba(0,0,0,0.5);

  animation: zoom 0.3s ease;
}

@keyframes zoom {

  from {
    opacity: 0;
    transform: scale(0.95);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }

}


/* CERRAR */

.cerrar {
  position: absolute;

  top: 18px;
  right: 28px;

  color: white;

  font-family: Arial, sans-serif;
  font-size: 40px;

  cursor: pointer;

  opacity: 0.8;

  z-index: 10;

  user-select: none;
}

.cerrar:hover {
  opacity: 1;
}


/* FLECHAS */

.flecha {
  position: absolute;

  top: 50%;

  transform: translateY(-50%);

  color: white;

  font-family: Arial, sans-serif;
  font-size: 55px;

  cursor: pointer;

  opacity: 0.7;

  padding: 20px;

  user-select: none;

  z-index: 10;
}

.flecha:hover {
  opacity: 1;
}

.anterior {
  left: 15px;
}

.siguiente {
  right: 15px;
}


/* INFORMACIÓN LIGHTBOX */

.info-foto {
  position: absolute;

  bottom: 17px;
  left: 50%;

  transform: translateX(-50%);

  text-align: center;

  color: white;

  font-family: Arial, sans-serif;

  white-space: nowrap;
}

.nombre-seccion {
  font-family: Georgia, "Times New Roman", serif;
  font-style: italic;
  font-size: 17px;

  margin-bottom: 5px;
}

.contador {
  font-size: 11px;
  letter-spacing: 2px;
  opacity: 0.7;
}


/* =========================
   TABLET
========================= */

@media (max-width: 900px) {

  .galeria {
    columns: 2;
  }

  .seccion {
    margin-bottom: 70px;
  }

}


/* =========================
   MÓVIL
========================= */

@media (max-width: 600px) {

  body {
    padding: 40px 10px 60px;
  }

  .cabecera {
    margin-bottom: 55px;
  }

  .cabecera h1 {
    font-size: 39px;
  }

  .cabecera p {
    font-size: 11px;
    letter-spacing: 1.5px;
  }

  .seccion {
    margin-bottom: 60px;
  }

  .titulo-seccion {
    margin-bottom: 25px;
  }

  .titulo-seccion h2 {
    font-size: 30px;
  }

  .galeria {
    columns: 2;
    column-gap: 8px;
  }

  .foto {
    margin-bottom: 8px;
    border-radius: 7px;
  }

  .lightbox {
    padding: 10px;
  }

  .lightbox img {
    max-width: 95vw;
    max-height: 80vh;
  }

  .flecha {
    font-size: 38px;
    padding: 8px;
  }

  .anterior {
    left: 2px;
  }

  .siguiente {
    right: 2px;
  }

  .cerrar {
    top: 10px;
    right: 17px;
  }

}

</style>
</head>


<body>


<!-- CABECERA -->

<div class="cabecera">

  <h1>Nuestra historia</h1>

  <p>UN CAMINO QUE NOS HA TRAÍDO HASTA AQUÍ</p>

</div>


<!-- LAS SECCIONES SE CREAN AUTOMÁTICAMENTE -->

<div id="contenido"></div>


<!-- LIGHTBOX -->

<div class="lightbox" id="lightbox">

  <div class="cerrar" id="cerrar">
    ×
  </div>

  <div class="flecha anterior" id="anterior">
    ‹
  </div>

  <img
    id="imagenGrande"
    src=""
    alt="Nuestra historia"
  >

  <div class="flecha siguiente" id="siguiente">
    ›
  </div>

  <div class="info-foto">

    <div
      class="nombre-seccion"
      id="nombreSeccion">
    </div>

    <div
      class="contador"
      id="contador">
    </div>

  </div>

</div>


<script>

/* =========================================
   AQUÍ ESTÁ ORGANIZADA NUESTRA HISTORIA
========================================= */

const secciones = [

  {
    titulo: "La casualidad",
    fotos: [13, 20]
  },

  {
    titulo: "El Secreto",
    fotos: [24, 23, 22, 8, 7]
  },

  {
    titulo: "La pareja",
    fotos: [10, 15, 17, 5, 6, 11, 12, 2, 16]
  },

  {
    titulo: "La promesa",
    fotos: [1, 3, 4, 9, 14, 18, 19, 25, 26]
  },

  {
    titulo: "Hoy en día",
    fotos: [21]
  }

];


/* =========================================
   CREAR SECCIONES
========================================= */

const contenido =
  document.getElementById("contenido");


let todasLasFotos = [];


secciones.forEach((seccion) => {

  const bloque =
    document.createElement("section");

  bloque.className = "seccion";


  /* TÍTULO */

  const titulo =
    document.createElement("div");

  titulo.className = "titulo-seccion";

  titulo.innerHTML = `
    <h2>${seccion.titulo}</h2>
    <div class="linea"></div>
  `;


  /* GALERÍA */

  const galeria =
    document.createElement("div");

  galeria.className = "galeria";


  seccion.fotos.forEach(
    (numero, posicion) => {

      const contenedor =
        document.createElement("div");

      contenedor.className = "foto";

      contenedor.style.animationDelay =
        Math.min(posicion * 0.08, 0.6) + "s";


      const imagen =
        document.createElement("img");


      /*
       IMPORTANTE:
       Las imágenes están dentro
       de la carpeta "galeria"
       y tienen extensión .JPG
      */

      imagen.src =
        `./galeria/${encodeURIComponent(nombreArchivo)}`;


      imagen.alt =
        `${seccion.titulo} - Foto ${numero}`;


      imagen.loading = "lazy";


      /*
       Guardamos a qué sección
       pertenece cada foto.
      */

      imagen.dataset.seccion =
        seccion.titulo;


      contenedor.appendChild(imagen);

      galeria.appendChild(contenedor);


      todasLasFotos.push(imagen);

    }
  );


  bloque.appendChild(titulo);

  bloque.appendChild(galeria);

  contenido.appendChild(bloque);

});


/* =========================================
   LIGHTBOX
========================================= */

const lightbox =
  document.getElementById("lightbox");

const imagenGrande =
  document.getElementById("imagenGrande");

const cerrar =
  document.getElementById("cerrar");

const anterior =
  document.getElementById("anterior");

const siguiente =
  document.getElementById("siguiente");

const contador =
  document.getElementById("contador");

const nombreSeccion =
  document.getElementById("nombreSeccion");


let indiceActual = 0;


/* ACTUALIZAR FOTO */

function actualizarFoto() {

  const foto =
    todasLasFotos[indiceActual];


  imagenGrande.src =
    foto.src;


  nombreSeccion.textContent =
    foto.dataset.seccion;


  contador.textContent =
    `${indiceActual + 1} / ${todasLasFotos.length}`;

}


/* ABRIR */

function mostrarFoto(indice) {

  indiceActual = indice;

  actualizarFoto();

  lightbox.classList.add("activo");

  document.body.style.overflow = "hidden";

}


/* CLICK EN FOTOS */

todasLasFotos.forEach(
  (foto, indice) => {

    foto.addEventListener(
      "click",
      () => {

        mostrarFoto(indice);

      }
    );

  }
);


/* ANTERIOR */

function fotoAnterior() {

  indiceActual--;

  if (indiceActual < 0) {

    indiceActual =
      todasLasFotos.length - 1;

  }

  actualizarFoto();

}


/* SIGUIENTE */

function fotoSiguiente() {

  indiceActual++;

  if (
    indiceActual >= todasLasFotos.length
  ) {

    indiceActual = 0;

  }

  actualizarFoto();

}


/* FLECHAS */

anterior.addEventListener(
  "click",
  fotoAnterior
);

siguiente.addEventListener(
  "click",
  fotoSiguiente
);


/* CERRAR */

function cerrarGaleria() {

  lightbox.classList.remove("activo");

  document.body.style.overflow = "auto";

}

cerrar.addEventListener(
  "click",
  cerrarGaleria
);


/* CLICK FUERA DE FOTO */

lightbox.addEventListener(
  "click",
  (e) => {

    if (e.target === lightbox) {

      cerrarGaleria();

    }

  }
);


/* =========================================
   TECLADO
========================================= */

document.addEventListener(
  "keydown",
  (e) => {

    if (
      !lightbox.classList.contains("activo")
    ) {
      return;
    }

    if (e.key === "ArrowRight") {
      fotoSiguiente();
    }

    if (e.key === "ArrowLeft") {
      fotoAnterior();
    }

    if (e.key === "Escape") {
      cerrarGaleria();
    }

  }
);


/* =========================================
   DESLIZAR EN MÓVIL
========================================= */

let inicioTouch = 0;


imagenGrande.addEventListener(
  "touchstart",
  (e) => {

    inicioTouch =
      e.changedTouches[0].screenX;

  },
  { passive: true }
);


imagenGrande.addEventListener(
  "touchend",
  (e) => {

    const finalTouch =
      e.changedTouches[0].screenX;


    const diferencia =
      inicioTouch - finalTouch;


    if (
      Math.abs(diferencia) < 50
    ) {
      return;
    }


    if (diferencia > 0) {

      fotoSiguiente();

    }

    else {

      fotoAnterior();

    }

  },
  { passive: true }
);

</script>


</body>
</html>
