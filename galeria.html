<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nuestra historia</title>

<style>

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
}

body {
  background: #f7f4ef;
  color: #3f3a36;
  font-family: Georgia, "Times New Roman", serif;
  padding: 55px 20px 80px;
}


/* CABECERA */

.cabecera {
  text-align: center;
  margin-bottom: 70px;
}

.cabecera h1 {
  margin: 0 0 14px;
  font-size: 54px;
  font-weight: 400;
}

.cabecera p {
  margin: 0;
  font-family: Arial, sans-serif;
  font-size: 13px;
  color: #77716c;
  letter-spacing: 2px;
}


/* SECCIONES */

.seccion {
  max-width: 1250px;
  margin: 0 auto 90px;
}

.titulo-seccion {
  text-align: center;
  margin-bottom: 35px;
}

.titulo-seccion h2 {
  margin: 0;
  font-size: 40px;
  font-weight: 400;
  font-style: italic;
}

.linea {
  width: 55px;
  height: 1px;
  margin: 16px auto 0;
  background: #9d9287;
}


/* GALERÍA */

.galeria {
  columns: 3;
  column-gap: 16px;
}

.foto {
  position: relative;
  width: 100%;
  display: inline-block;
  margin-bottom: 16px;
  overflow: hidden;
  border-radius: 12px;
  cursor: pointer;
  break-inside: avoid;
  box-shadow: 0 4px 16px rgba(0,0,0,0.09);
}

.foto img {
  display: block;
  width: 100%;
  height: auto;
  opacity: 1;
  transition: transform 0.5s ease;
}

.foto:hover img {
  transform: scale(1.035);
}


/* LIGHTBOX */

.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(18,17,16,0.96);
  z-index: 99999;
  align-items: center;
  justify-content: center;
}

.lightbox.activo {
  display: flex;
}

.lightbox img {
  max-width: 90vw;
  max-height: 84vh;
  object-fit: contain;
}

.cerrar {
  position: absolute;
  right: 25px;
  top: 15px;
  color: white;
  font-family: Arial, sans-serif;
  font-size: 42px;
  cursor: pointer;
}

.flecha {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  color: white;
  font-family: Arial, sans-serif;
  font-size: 55px;
  padding: 20px;
  cursor: pointer;
  user-select: none;
}

.anterior {
  left: 5px;
}

.siguiente {
  right: 5px;
}

.info {
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  text-align: center;
}

.info-seccion {
  font-size: 17px;
  font-style: italic;
  margin-bottom: 4px;
}

.contador {
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
}


/* TABLET */

@media (max-width: 900px) {

  .galeria {
    columns: 2;
  }

}


/* MÓVIL */

@media (max-width: 600px) {

  body {
    padding: 35px 9px 60px;
  }

  .cabecera h1 {
    font-size: 38px;
  }

  .titulo-seccion h2 {
    font-size: 30px;
  }

  .galeria {
    columns: 2;
    column-gap: 8px;
  }

  .foto {
    margin-bottom: 8px;
    border-radius: 7px;
  }

  .lightbox img {
    max-width: 95vw;
    max-height: 78vh;
  }

}

</style>

</head>

<body>


<!-- CABECERA -->

<div class="cabecera">

  <h1>Nuestra historia</h1>

  <p>UN CAMINO QUE NOS HA TRAÍDO HASTA AQUÍ</p>

</div>



<!-- =========================
     LA CASUALIDAD
========================= -->

    <div class="foto">

        src="galeria/foto%20(13).JPG"

<!-- =========================
     EL SECRETO
========================= -->

  </div>

  <div class="galeria">

    <div class="foto">

    <div class="foto"><img src="galeria/foto%20(15).JPG" data-seccion="La pareja"></div>

    <div class="foto"><img src="galeria/foto%20(17).JPG" data-seccion="La pareja"></div>

    <div class="foto"><img src="galeria/foto%20(5).JPG" data-seccion="La pareja"></div>

    <div class="foto"><img src="galeria/foto%20(6).JPG" data-seccion="La pareja"></div>

    <div class="foto"><img src="galeria/foto%20(11).JPG" data-seccion="La pareja"></div>

<!-- =========================
     VISOR GRANDE
========================= -->

<div class="lightbox" id="lightbox">

  <div class="cerrar" id="cerrar">×</div>

  <div class="flecha anterior" id="anterior">‹</div>

  <img id="imagenGrande">

  <div class="flecha siguiente" id="siguiente">›</div>

  <div class="info">

    <div class="info-seccion" id="infoSeccion"></div>

    <div class="contador" id="contador"></div>

  </div>

</div>



<script>

const fotos =
  Array.from(document.querySelectorAll(".foto img"));

const lightbox =
  document.getElementById("lightbox");

const imagenGrande =
  document.getElementById("imagenGrande");

const infoSeccion =
  document.getElementById("infoSeccion");

const contador =
  document.getElementById("contador");

let indice = 0;


function mostrarFoto() {

  imagenGrande.src =
    fotos[indice].src;

  infoSeccion.textContent =
    fotos[indice].dataset.seccion;

  contador.textContent =
    (indice + 1) + " / " + fotos.length;

}


fotos.forEach(function(foto, posicion) {

  foto.addEventListener("click", function() {

    indice = posicion;

    mostrarFoto();

    lightbox.classList.add("activo");

  });

});


document
.getElementById("siguiente")
.addEventListener("click", function() {

  indice++;

  if (indice >= fotos.length) {
    indice = 0;
  }

  mostrarFoto();

});


document
.getElementById("anterior")
.addEventListener("click", function() {

  indice--;

  if (indice < 0) {
    indice = fotos.length - 1;
  }

  mostrarFoto();

});


document
.getElementById("cerrar")
.addEventListener("click", function() {

  lightbox.classList.remove("activo");

});


document.addEventListener("keydown", function(e) {

  if (!lightbox.classList.contains("activo")) {
    return;
  }

  if (e.key === "ArrowRight") {

    indice++;

    if (indice >= fotos.length) {
      indice = 0;
    }

    mostrarFoto();

  }

  if (e.key === "ArrowLeft") {

    indice--;

    if (indice < 0) {
      indice = fotos.length - 1;
    }

    mostrarFoto();

  }

  if (e.key === "Escape") {

    lightbox.classList.remove("activo");

  }

});

</script>

</html>
